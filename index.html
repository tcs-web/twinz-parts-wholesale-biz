<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - TCS PARTS BIZPORTAL</title>
<style>
    body{font-family:Arial;background:#f4f4f4;padding:10px;margin:0;}
.container{max-width:1000px;margin:auto;background:white;padding:15px;border-radius:12px;}
    h2{color:#0A1A2F;text-align:center;margin:10px 0;}
    input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;}
    button{padding:10px 12px;background:#FF8C00;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:5px 2px;font-size:14px;}
.btn-danger{background:#d32f2f;}
.btn-sold{background:#4CAF50;}
.btn-edit{background:#1976d2;}
.login-box{display:block;}.form-box{display:none;}
.success{color:green;text-align:center;}.error{color:red;text-align:center;font-weight:bold;}
.preview-img{width:100%;max-height:250px;object-fit:cover;border-radius:8px;margin:10px 0;}
.parts-list{display:grid;grid-template-columns:1fr;gap:12px;margin-top:20px;} /* 1 column on mobile */
.part-item{background:#f9f9f9;padding:10px;border-radius:8px;display:flex;gap:10px;align-items:flex-start;}
.part-item img{width:100px;height:100px;object-fit:cover;border-radius:6px;flex-shrink:0;}
.part-info{flex:1;word-break:break-word;} /* stops long text from breaking layout */
.badge{background:#4CAF50;color:white;padding:3px 8px;border-radius:4px;font-size:12px;display:inline-block;margin:3px 0;}
.badge.sold{background:red;}
.btn-group button{width:100%;margin:4px 0;}

/* Tablet/Desktop: 2 columns */
@media (min-width: 768px) {
 .parts-list{grid-template-columns:1fr 1fr;}
 .btn-group{display:flex;gap:5px;}
 .btn-group button{width:auto;flex:1;}
}
</style>
</head>
<body>

<div class="container">
    <h2>TCS PARTS BIZPORTAL - Admin</h2>
    <p id="loggedInAs" style="text-align:center;font-size:12px;"></p>

    <div class="login-box" id="loginBox">
        <h3>Admin Login</h3>
        <input type="email" id="email" placeholder="Admin Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()" style="width:100%;">Login</button>
        <p id="loginError" class="error"></p>
    </div>

    <div class="form-box" id="formBox">
        <h3 id="formTitle">Add New Part</h3>
        <input type="hidden" id="editId">
        <input type="text" id="make" placeholder="Make e.g Toyota" required>
        <input type="text" id="model" placeholder="Model e.g Hilux" required>
        <input type="number" id="year" placeholder="Year e.g 2020" required>
        <input type="text" id="partName" placeholder="Part Name e.g Alternator" required>
        <input type="text" id="partCode" placeholder="Part Code">
        <input type="number" id="price" placeholder="Price R e.g 3450" required>
        <select id="condition"><option>Used</option><option>New</option><option>Refurb</option></select>
        <select id="category"><option value="used">Used Parts</option><option value="new">New Parts</option><option value="stripped">Stripped Vehicle</option></select>
        <select id="vehicleType"><option value="car">Car</option><option value="bakkie">Bakkie</option><option value="suv">SUV</option></select>
        <input type="text" id="warranty" placeholder="Warranty e.g 90 Day">
        <input type="file" id="imageFile" accept="image/*" onchange="previewImage(event)">
        <img id="preview" class="preview-img" style="display:none;">

        <button onclick="savePart()" style="width:100%;">Save Part</button>
        <button onclick="resetForm()" style="background:#666;width:100%;">Clear</button>
        <button onclick="logout()" style="background:#333;width:100%;margin-top:10px;">Logout</button>
        <p id="successMsg" class="success"></p>
        <p id="errorMsg" class="error"></p>

        <hr>
        <h3>Stock</h3>
        <button onclick="filterParts('available')">Available</button>
        <button onclick="filterParts('sold')">Sold</button>
        <button onclick="filterParts('all')">All</button>
        <div class="parts-list" id="partsList">Loading...</div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyCkZXuJJ67POe1YLogqDEThuVk-84rnjIU",
  authDomain: "tcs-parts-bizportal.firebaseapp.com",
  databaseURL: "https://tcs-parts-bizportal-default-rtdb.firebaseio.com/",
  projectId: "tcs-parts-bizportal",
  storageBucket: "tcs-parts-bizportal.firebasestorage.app",
  messagingSenderId: "472208411435",
  appId: "1:472208411435:web:dae65a8b07ddd8a55f136e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const storage = getStorage(app);

let imageFile = null; let allPartsData = {}; let currentFilter = 'available';

onAuthStateChanged(auth, (user) => {
  if (user && ['ceo@tcspartsbizportal.co.za','manager@tcspartsbizportal.co.za'].includes(user.email)) {
    loggedInAs.innerText = "Logged in as: " + user.email;
    loginBox.style.display = 'none'; formBox.style.display = 'block'; loadParts();
  } else { loginBox.style.display = 'block'; formBox.style.display = 'none'; }
});

window.login = () => { loginError.innerText = ""; signInWithEmailAndPassword(auth, email.value.trim().toLowerCase(), password.value).catch(err => loginError.innerText = "Login Failed: " + err.message); }
window.logout = () => signOut(auth);
window.previewImage = (e) => { imageFile = e.target.files[0]; preview.src = URL.createObjectURL(imageFile); preview.style.display = 'block'; }

function loadParts(){
    onValue(ref(db, 'tcs-parts-bizportal/categories'), (snapshot) => {
        allPartsData = snapshot.val() || {}; filterParts(currentFilter);
    }, (error) => { errorMsg.innerText = "DB Error: " + error.message });
}

window.filterParts = (filter) => {
    currentFilter = filter;
    partsList.innerHTML = '';
    Object.keys(allPartsData).forEach(key => {
        const p = allPartsData[key];
        if(filter === 'available' && p.status === 'sold') return;
        if(filter === 'sold' && p.status!== 'sold') return;
        partsList.innerHTML += `
        <div class="part-item">
            <img src="${p.image || 'https://via.placeholder.com/100'}">
            <div class="part-info">
                <b>${p.year} ${p.make} ${p.model}</b> <span class="badge ${p.status}">${p.status || 'available'}</span><br>
                <b>${p.partName}</b><br>
                R${p.price?.toLocaleString()}<br>
                <div class="btn-group">
                  <button class="btn-edit" onclick='editPart("${key}")'>Edit</button>
                  ${p.status!=='sold'?`<button class="btn-sold" onclick='markSold("${key}")'>Mark SOLD</button>`:''}
                  <button class="btn-danger" onclick='deletePart("${key}")'>Delete</button>
                </div>
            </div>
        </div>`;
    });
}

window.markSold = (id) => {
    if(confirm("Mark this part as SOLD?")){
        update(ref(db, `tcs-parts-bizportal/categories/${id}`), {status: 'sold', dateSold: new Date().toISOString()})
       .catch(err => errorMsg.innerText = "Error: " + err.message);
    }
}

window.deletePart = (id) => { // NEW DELETE FUNCTION
    if(confirm("Are you sure you want to DELETE this part? This cannot be undone.")){
        remove(ref(db, `tcs-parts-bizportal/categories/${id}`))
       .then(()=> successMsg.innerText = "Part Deleted")
       .catch(err => errorMsg.innerText = "Delete Error: " + err.message);
    }
}

window.editPart = (id) => {
    const p = allPartsData[id]; formTitle.innerText = "Edit Part"; editId.value = id;
    ['make','model','year','partName','partCode','price','condition','category','vehicleType','warranty'].forEach(k => {
        if(document.getElementById(k)) document.getElementById(k).value = p[k] || '';
    });
    preview.src = p.image; preview.style.display = 'block'; window.scrollTo(0,0);
}

window.savePart = async () => {
    errorMsg.innerText = ""; successMsg.innerText = "";
    if(!make.value ||!model.value ||!year.value ||!partName.value ||!price.value){ errorMsg.innerText = "Please fill all required fields"; return; }

    let partData = {
        make: make.value, model: model.value, year: year.value, partName: partName.value,
        partCode: partCode.value, price: Number(price.value), condition: condition.value,
        category: category.value, vehicleType: vehicleType.value, warranty: warranty.value,
        location: "Burgersfort", status: 'available', dateAdded: new Date().toISOString()
    };

    try {
        if(imageFile){
            const fileRef = sRef(storage, 'parts/' + Date.now() + '-' + imageFile.name);
            const snap = await uploadBytes(fileRef, imageFile);
            partData.image = await getDownloadURL(snap.ref);
        } else if(editId.value) { partData.image = preview.src; }
        else { errorMsg.innerText = "Please select an image"; return; }

        if(editId.value){ await update(ref(db, `tcs-parts-bizportal/categories/${editId.value}`), partData); }
        else { await push(ref(db, 'tcs-parts-bizportal/categories'), partData); }

        successMsg.innerText = "Part Saved Successfully!"; resetForm();
    } catch(err){ errorMsg.innerText = "SAVE FAILED: " + err.message; }
}

window.resetForm = () => {
    formTitle.innerText = "Add New Part"; editId.value = '';
    document.querySelectorAll('input[type=text], input[type=number]').forEach(i => i.value = '');
    preview.style.display = 'none'; imageFile = null;
}
</script>
</body>
</html>
